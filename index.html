<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漢検3級 毎日ドリル</title>
<title>漢検3級 毎日ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&family=DotGothic16&display=swap">
<style>
/* Layout: one narrow phone column; home = stats + start, quiz = card + 2x2 choices, marks drawn like a red pen */
:root{
  --bg:#eef2f7; --card:#ffffff; --ink:#1b2340; --sub:#5d6680; --line:#d5dce8;
  --ai:#24357a; --ai-soft:#dfe5f6; --shu:#d8402b; --shu-soft:#fbe3de;
  --ok:#1f8a5b; --ok-soft:#dcf2e7; --gold:#d99a14; --gold-soft:#fbefd2;
  --font-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-px:"DotGothic16","Zen Maru Gothic",monospace;
  --font-kanji:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1424; --card:#1a2138; --ink:#e9ecf6; --sub:#9aa3bd; --line:#2e3756;
  --ai:#8fa6ff; --ai-soft:#25305a; --shu:#ff7a63; --shu-soft:#4a2620;
  --ok:#4fd197; --ok-soft:#173a2c; --gold:#f2bb45; --gold-soft:#3d3018; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1424; --card:#1a2138; --ink:#e9ecf6; --sub:#9aa3bd; --line:#2e3756;
  --ai:#8fa6ff; --ai-soft:#25305a; --shu:#ff7a63; --shu-soft:#4a2620;
  --ok:#4fd197; --ok-soft:#173a2c; --gold:#f2bb45; --gold-soft:#3d3018; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
h1{font-size:1.25rem;margin:0;font-weight:900;letter-spacing:.02em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.date{color:var(--sub);font-size:.85rem}
.panel{background:var(--card);border-radius:18px;padding:18px;border:1px solid var(--line)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .num b{font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums}
.ring .num span{font-size:.7rem;color:var(--sub)}
.stats{display:flex;flex-direction:column;gap:8px;min-width:0}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.stat b{font-variant-numeric:tabular-nums}
.flame{display:inline-flex;align-items:center;gap:6px;background:var(--shu-soft);color:var(--shu);font-weight:900;border-radius:99px;padding:6px 12px;font-size:.95rem;align-self:flex-start}
.stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.stamp{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--sub);border:1.5px dashed var(--line);font-variant-numeric:tabular-nums;max-width:100%}
.stamp.done{border:2.5px solid var(--shu);color:var(--shu);font-family:var(--font-kanji);font-weight:800;font-size:1rem;transform:rotate(-8deg)}
.stamp.today{border-style:solid;border-color:var(--ai)}
.go{width:100%;background:var(--ai);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 color-mix(in srgb,var(--ai) 60%,#000)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--ai) 60%,#000)}
.go b{font-size:1.35rem;font-weight:900}
.go span{font-size:.85rem;opacity:.9}
:root[data-theme="dark"] .go, .go{color:var(--card)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub-btn{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}
.sub-btn small{color:var(--sub);font-weight:500;font-size:.78rem}
.sub-btn.red{border-color:var(--shu);color:var(--shu)}
.sub-btn.gold{border-color:var(--gold);color:var(--gold)}
.sec-title{font-weight:900;font-size:1rem;margin:4px 0 0}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px}
.cat .nm{font-weight:700;font-size:.92rem;display:flex;justify-content:space-between;gap:6px}
.cat .nm small{color:var(--sub);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--ai-soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--ok)} .bar .s{background:color-mix(in srgb,var(--ok) 35%,var(--ai-soft))}
.legend{display:flex;gap:14px;font-size:.75rem;color:var(--sub);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.foot{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;color:var(--sub);flex-wrap:wrap}
.link{color:var(--sub);text-decoration:underline;font-size:.8rem;padding:6px 0}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.close{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:1.1rem;flex:none}
.prog{flex:1;height:12px;border-radius:99px;background:var(--ai-soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ai);border-radius:99px;transition:width .3s}
.cnt{font-variant-numeric:tabular-nums;color:var(--sub);font-size:.85rem;flex:none}
.qcard{background:var(--card);border-radius:20px;padding:20px 18px 22px;border:1px solid var(--line);position:relative;display:flex;flex-direction:column;gap:14px;min-height:210px;overflow:hidden}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--ai-soft);color:var(--ai)}
.chip.hot{background:var(--gold-soft);color:var(--gold)}
.chip.again{background:var(--shu-soft);color:var(--shu)}
.inst{color:var(--sub);font-size:.85rem}
.qtext{font-family:var(--font-kanji);font-weight:600;font-size:1.55rem;line-height:1.9;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.qtext .t{text-decoration:underline;text-decoration-color:var(--shu);text-decoration-thickness:3px;text-underline-offset:7px;font-weight:800}
.qtext .k{display:inline-block;border:2px solid var(--shu);border-radius:6px;padding:0 6px;line-height:1.5;color:var(--shu);font-family:var(--font-ui);font-weight:700;font-size:.85em}
.masu{align-self:center;width:140px;height:140px;border:2px solid var(--ink);position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--font-kanji);font-weight:800;font-size:96px;line-height:1;max-width:100%}
.masu::before,.masu::after{content:"";position:absolute;background:none;border:0 dashed var(--line)}
.masu::before{left:50%;top:0;bottom:0;border-left-width:1.5px}
.masu::after{top:50%;left:0;right:0;border-top-width:1.5px}
.masu span{position:relative;z-index:1}
.mark{position:absolute;right:10px;top:8px;width:110px;height:110px;pointer-events:none;z-index:2}
.mark path,.mark circle{fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw .45s ease-out forwards}
.mark.o circle{stroke:var(--shu)} .mark.x path{stroke:var(--ai)}
@keyframes draw{to{stroke-dashoffset:0}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.one{grid-template-columns:1fr}
.ch{background:var(--card);border:2px solid var(--line);border-radius:16px;min-height:72px;padding:10px;font-size:1.25rem;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.ch.kj{font-family:var(--font-kanji);font-size:1.9rem;font-weight:800}
.ch.sm{font-size:1rem;justify-content:flex-start;text-align:left;min-height:56px;gap:10px}
.ch.sm b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ai-soft);color:var(--ai);display:flex;align-items:center;justify-content:center}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.ch.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.ch.wrong{border-color:var(--shu);background:var(--shu-soft);box-shadow:0 4px 0 var(--shu)}
.ch.dim{opacity:.45}
.typebox{display:flex;flex-direction:column;gap:10px}
.qtext .okuri{font-weight:600}
/* game */
.px{display:block;image-rendering:pixelated;shape-rendering:crispEdges}
.pxframe{flex:none;background:#20243a;border:3px solid #0f1220;box-shadow:inset 0 0 0 2px #3a4166;border-radius:6px;padding:5px;display:flex;align-items:center;justify-content:center}
.lvhead{display:flex;align-items:center;gap:10px;min-width:0}
.lvname{font-family:var(--font-px)}
.titles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.ttl{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.62rem;text-align:center;font-family:var(--font-px);line-height:1.25}
.ttl.lock{color:var(--sub)}
.ttl.now .pxframe{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.ovl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none}
.combo-big{font-family:var(--font-px);font-size:3.2rem;font-weight:400;color:#fff;text-align:center;line-height:1;
  text-shadow:3px 3px 0 var(--shu),-2px -2px 0 #1a1626,2px -2px 0 #1a1626,-2px 2px 0 #1a1626,2px 2px 0 #1a1626;
  animation:comboAnim 1.1s cubic-bezier(.2,.8,.3,1) forwards}
.combo-big small{display:block;font-size:1.1rem;margin-top:6px;color:var(--gold);text-shadow:2px 2px 0 #1a1626}
@keyframes comboAnim{0%{opacity:0;transform:scale(.3)}18%{opacity:1;transform:scale(1.35)}32%{transform:scale(1)}65%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-110px) scale(.9)}}
.lvl-ovl{pointer-events:auto;background:rgba(10,12,24,.82);flex-direction:column;gap:14px;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.lvl-ovl .t1{font-family:var(--font-px);font-size:2.6rem;color:var(--gold);text-shadow:3px 3px 0 #000;animation:lvpop .7s cubic-bezier(.2,.8,.3,1.4)}
.lvl-ovl .t2{font-family:var(--font-px);font-size:4.2rem;color:#fff;line-height:1;text-shadow:4px 4px 0 var(--shu);animation:lvpop .9s cubic-bezier(.2,.8,.3,1.4)}
.lvl-ovl .t3{font-family:var(--font-px);font-size:1.1rem;color:#fff;text-align:center;line-height:1.6;padding-inline:16px}
.lvl-ovl .t3 b{color:var(--gold);font-weight:400;font-size:1.35rem}
.lvl-ovl .t4{font-size:.8rem;color:#c9cbe0;margin-top:6px}
.lvl-ovl .big{animation:spin-in 1s cubic-bezier(.2,.8,.3,1.3)}
@keyframes lvpop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes spin-in{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.spark{position:fixed;width:8px;height:8px;z-index:51;pointer-events:none;animation:spark 1.2s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
@media (prefers-reduced-motion:reduce){.combo-big,.lvl-ovl .t1,.lvl-ovl .t2,.lvl-ovl .big{animation:none}}
.lvcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.lvbadge{width:64px;height:64px;border-radius:18px;background:linear-gradient(145deg,var(--gold),color-mix(in srgb,var(--gold) 55%,var(--shu)));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.lvbadge small{font-size:.65rem;font-weight:700;letter-spacing:.06em}
.lvbadge b{font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums}
.lvinfo{display:flex;flex-direction:column;gap:6px;min-width:0}
.lvname{font-weight:900;font-size:1.05rem}
.xpbar{height:12px;border-radius:99px;background:var(--gold-soft);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .8s ease}
.xpnum{display:flex;justify-content:space-between;font-size:.75rem;color:var(--sub);font-variant-numeric:tabular-nums}
.combo{font-size:.75rem;font-weight:900;padding:4px 10px;border-radius:99px;background:var(--shu);color:#fff;animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.xpfloat{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-weight:900;font-size:1.5rem;color:var(--gold);pointer-events:none;animation:floatup 1s ease-out forwards;z-index:3;text-shadow:0 2px 0 var(--card)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}
.gain{display:flex;flex-direction:column;gap:8px;background:var(--gold-soft);border-radius:16px;padding:14px 16px}
.gain .row{display:flex;justify-content:space-between;font-size:.9rem;font-variant-numeric:tabular-nums}
.gain .tot{font-weight:900;font-size:1.1rem;color:var(--gold);border-top:1px dashed color-mix(in srgb,var(--gold) 50%,transparent);padding-top:8px}
.lvup{text-align:center;background:linear-gradient(145deg,var(--gold),color-mix(in srgb,var(--gold) 55%,var(--shu)));color:#fff;border-radius:18px;padding:18px;animation:pop .5s ease}
.lvup b{display:block;font-size:1.6rem;font-weight:900}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;font-size:.7rem;line-height:1.3}
.bdg .ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-kanji);font-weight:800;font-size:1.15rem;background:var(--gold-soft);color:var(--gold);border:2px solid var(--gold)}
.bdg.lock{opacity:.4}
.bdg.lock .ic{background:var(--line);color:var(--sub);border-color:var(--line)}
.bdg.new{border:2px solid var(--gold);animation:pop .5s ease}
.more{background:var(--gold);color:#fff;border-radius:16px;padding:16px;font-size:1.1rem;font-weight:900;width:100%;box-shadow:0 5px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.more small{display:block;font-size:.78rem;font-weight:700;opacity:.95}
.more:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.typebox input{width:100%;font-size:1.6rem;font-family:var(--font-ui);font-weight:700;text-align:center;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.typebox input:focus{outline:none;border-color:var(--ai)}
.typebox input.right{border-color:var(--ok);background:var(--ok-soft)}
.typebox input.wrong{border-color:var(--shu);background:var(--shu-soft)}
.hintline{font-size:.8rem;color:var(--sub);text-align:center}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;font-size:.92rem}
.toggle small{display:block;color:var(--sub);font-weight:500;font-size:.75rem}
.sw{flex:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);transition:left .2s}
.sw.on{background:var(--ok)} .sw.on::after{left:25px}
.ch[disabled]{cursor:default}
.fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-soft)} .fb.ng{background:var(--shu-soft)}
.fb .h{font-weight:900;font-size:1.05rem}
.fb.ok .h{color:var(--ok)} .fb.ng .h{color:var(--shu)}
.fb .e{font-size:.92rem;line-height:1.6}
.fb .e b{font-family:var(--font-kanji);font-size:1.1em}
.fb .e s{text-decoration-color:var(--shu);text-decoration-thickness:2px}
.exp{display:flex;flex-direction:column;gap:7px;background:var(--card);border-radius:12px;padding:12px;margin-top:2px}
.exp.small{padding:8px 10px;gap:5px;background:var(--bg)}
.exr{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;font-size:.92rem;line-height:1.65}
.exp.small .exr{font-size:.8rem;line-height:1.55}
.exk{font-size:.72rem;font-weight:900;color:var(--ai);background:var(--ai-soft);border-radius:6px;padding:2px 7px;white-space:nowrap}
.exk.warn{color:var(--shu);background:var(--shu-soft)}
.exv{min-width:0;overflow-wrap:anywhere}
.sendbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.linebtn{display:block;background:#06c755;color:#fff;font-weight:900;font-size:1.15rem;text-decoration:none;border-radius:14px;padding:15px;box-shadow:0 5px 0 #04933f}
.linebtn:active{transform:translateY(3px);box-shadow:0 2px 0 #04933f}
.next{background:var(--ai);color:var(--card);border-radius:16px;padding:16px;font-size:1.15rem;font-weight:900;width:100%;box-shadow:0 5px 0 color-mix(in srgb,var(--ai) 60%,#000)}
.next:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--ai) 60%,#000)}

/* result */
.res{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.score{font-size:3.2rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.score small{font-size:1.2rem;color:var(--sub)}
.hanamaru{width:150px;height:150px}
.hanamaru path{fill:none;stroke:var(--shu);stroke-width:5;stroke-linecap:round}
.list{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.item .q{font-family:var(--font-kanji);font-size:1.05rem;line-height:1.7;overflow-wrap:anywhere}
.item .q .t{text-decoration:underline;text-decoration-color:var(--shu);text-underline-offset:4px}
.item .q .k{color:var(--shu);font-family:var(--font-ui);font-weight:700}
.item .a{font-size:.9rem;color:var(--ok);font-weight:700}
.item .a b{font-family:var(--font-kanji);font-size:1.15em}
.item .w{font-size:.75rem;color:var(--shu)}
.confirm{background:var(--shu-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:.9rem}
.confirm .row{display:flex;gap:10px}
.confirm button{flex:1;padding:10px;border-radius:10px;font-weight:700;background:var(--card);border:1px solid var(--line)}
.confirm button.dang{background:var(--shu);color:var(--card);border:0}
.empty{color:var(--sub);text-align:center;padding:20px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.mark path,.mark circle{animation:none;stroke-dashoffset:0}.prog i{transition:none}}
</style>

</head><body>
<div class="wrap" id="app"></div>

<script>
// ===== 問題データ（出題傾向をもとにしたオリジナル問題）=====

function buildDaily(){
  const N=20, out=[], used=new Set();
  const add=q=>{ if(out.length<N && !used.has(q.id)){ out.push(q); used.add(q.id);} };
  Q.filter(isDue).sort((a,b)=>(b.h-a.h)||(st(a.id).box-st(b.id).box)).slice(0,14).forEach(add);
  shuffle(Q.filter(q=>q.h && !st(q.id))).slice(0,4).forEach(add);
  const cats=Object.keys(CATS);
  shuffle(Q.filter(q=>!st(q.id))).sort((a,b)=>b.h-a.h).forEach(q=>{ if(out.length<N) add(q); });
  shuffle(Q.filter(q=>!isMastered(q))).forEach(add);
  shuffle(Q).forEach(add);
  return shuffle(out);
}

  if(!list.length){ home(); return; }
  sess={queue:list.map(q=>({q,again:false})), i:0, mode, first:{}, total:list.length, retries:0, combo:0, maxc:0, xp:0, xpCombo:0, startLv:lvOf(G().xp)};

}

  const cur=sess.queue[sess.i], q=cur.q, cat=CATS[q.c];
  const done=Math.min(sess.i, sess.queue.length);

  else choices=shuffle([q.a,...q.d]);

  const body = q.c==="bushu" ? `<div class="masu"><span>${q.q}</span></div>`
             : q.c==="kosei" ? `<div class="masu" style="width:auto;padding:0 14px;font-size:72px;height:110px"><span>${q.q}</span></div>`
             : typed ? `<div class="qtext">${esc(q.q).replace(/〔(.+?)〕/, ()=>`<span class="t">${esc(yk.kanji)}</span><span class="okuri">${esc(yk.okuri)}</span>`).replace(/［(.+?)］/g,'<span class="k">$1</span>')}</div>`
             : `<div class="qtext">${fmt(esc(q.q))}</div>`;

function answer(v,btn,typed){
  const cur=sess.queue[sess.i], q=cur.q;
  const yp = typed ? yomiParts(q) : null;
  const ok = typed ? (kanaNorm(v)===kanaNorm(yp.stem) || kanaNorm(v)===kanaNorm(q.a)) : v===q.a;
  if(typed){ const ti=app.querySelector("#ti"), sb=app.querySelector("#tf button"); if(ti){ ti.disabled=true; ti.classList.add(ok?"right":"wrong"); } if(sb) sb.remove(); }
  app.querySelectorAll(".ch").forEach(b=>{ b.disabled=true;
    if(b.dataset.v===q.a) b.classList.add("right"); else if(b===btn) b.classList.add("wrong"); else b.classList.add("dim"); });
  const card=app.querySelector("#card");
  card.insertAdjacentHTML("beforeend", ok
    ? `<svg class="mark o" viewBox="0 0 110 110"><circle cx="55" cy="55" r="42" transform="rotate(-100 55 55)"/></svg>`
    : `<svg class="mark x" viewBox="0 0 110 110"><path d="M22 22 L88 88"/><path d="M88 22 L22 88" style="animation-delay:.2s"/></svg>`);
  // 記録（この回の1回目の答えだけで判定）
  if(!cur.again && !(q.id in sess.first)){
    sess.first[q.id]=ok;
    const s=S.items[q.id]||{box:0,due:TODAY,seen:0,wrong:0};
    s.seen++;
    if(ok){ s.box=Math.min(s.box+1,5); s.due=TODAY+INT[s.box]; }
    else { s.box=0; s.wrong++; s.due=TODAY+1; }
    S.items[q.id]=s; save();
  }
  if(!ok && sess.retries<10){ sess.queue.push({q,again:true}); sess.retries++; }
  const ansShow = q.c==="kosei" ? `${q.a}：${KOSEI[q.a]}` : (yp&&yp.okuri ? `${yp.stem}（${yp.okuri}）` : q.a);
  // ゲーム：コンボとXP
  if(ok){ sess.combo++; sess.maxc=Math.max(sess.maxc,sess.combo); const bonus=Math.min(10,(sess.combo-1)*2); const add=(cur.again?3:10)+bonus; sess.xp+=add; sess.xpCombo+=bonus;
    if(!cur.again){ G().tc++; } G().best=Math.max(G().best,sess.combo);
    const Lb=lvOf(G().xp); G().xp+=add; const La=lvOf(G().xp);
    card.insertAdjacentHTML("beforeend",`<div class="xpfloat">+${add} XP</div>`);
    if(sess.combo>=3){ app.querySelector(".chips").insertAdjacentHTML("beforeend",`<span class="combo">${sess.combo}コンボ！</span>`); showCombo(sess.combo); }
    if(La>Lb) setTimeout(()=>showLevelUp(La,Lb),sess.combo>=3?900:300);
  } else { sess.combo=0; }
  snd(ok);
  app.querySelector("#after").innerHTML=`
    <div class="fb ${ok?"ok":"ng"}">
      <div class="h">${ok?"せいかい！":"ざんねん… 正解は「"+esc(ansShow)+"」"}</div>
      ${!ok&&q.c!=="kosei"?`<div class="e">あなたの答え：<s>${esc(v)}</s></div>`:""}
      ${expHtml(q.e)}
      ${!ok?`<div class="e" style="color:var(--shu);font-weight:700">このあともう一回出るよ。明日も復習に出します。</div>`:""}
    </div>
    <button class="next" id="nx">${sess.i+1<sess.queue.length?"つぎへ":"結果を見る"}</button>`;
  const nx=app.querySelector("#nx"); nx.onclick=()=>{ sess.i++; sess.i<sess.queue.length?ask():result(); };
  nx.scrollIntoView({behavior:"smooth",block:"nearest"});
}

// ===== 報告コード（記録をまとめて文字にする）=====
function hsh(s){ let x=2166136261; for(const ch of s){ x^=ch.codePointAt(0); x=Math.imul(x,16777619)>>>0; } return x.toString(36); }
const byHash = Object.fromEntries(Q.map(q=>[hsh(q.id),q.id]));
function pad(n){ return String(n).padStart(2,"0"); }
function ymdN(n){ const d=new Date(n*864e5); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()); }
function toB64(bytes){ let s=""; for(let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function fromB64(t){ t=t.replace(/-/g,"+").replace(/_/g,"/"); while(t.length%4) t+="="; const s=atob(t), b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b; }
async function pack(){
  const it=Object.entries(S.items).map(([id,s])=>[hsh(id),s.box,s.wrong,s.seen,s.due-TODAY]);
  const dy={}; for(let i=0;i<60;i++){ const k=ymdN(TODAY-i); if(S.days[k]) dy[k]=[S.days[k].c,S.days[k].t,S.days[k].n||1]; }
  const json=JSON.stringify({v:1,d:TODAY,it,dy});
  try{ if(window.CompressionStream){
    const buf=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();
    return "KK3z"+toB64(new Uint8Array(buf)); } }catch(e){}
  return "KK3j"+toB64(new TextEncoder().encode(json));
}
async function unpack(text){
  const m=text.match(/KK3([zj])([A-Za-z0-9_-]+)/); if(!m) throw new Error("code");
  const bytes=fromB64(m[2]); let json;
  if(m[1]==="z"){ json=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text(); }
  else json=new TextDecoder().decode(bytes);
  const o=JSON.parse(json), items={}, days={};
  o.it.forEach(([h,box,wrong,seen,dd])=>{ const id=byHash[h]; if(id) items[id]={box,wrong,seen,due:o.d+dd}; });
  Object.entries(o.dy||{}).forEach(([k,[c,t,n]])=>days[k]={c,t,n});
  return {items,days,ref:o.d};
}
function statsOf(D,ref){
  const ok=q=>{const s=D.items[q.id]; return !!s&&s.box>=MASTER;};
  const hot=Q.filter(q=>q.h), hotM=hot.filter(ok).length;
  const weakL=Q.filter(q=>{const s=D.items[q.id]; return s&&s.wrong>0&&s.box<MASTER;}).sort((a,b)=>D.items[b.id].wrong-D.items[a.id].wrong);
  let sk=0,k=ref; if(!D.days[ymdN(k)]) k--; while(D.days[ymdN(k)]){ sk++; k--; }
  const cats=Object.entries(CATS).map(([c,v])=>{ const qs=Q.filter(q=>q.c===c); return {c,n:v.n,total:qs.length,m:qs.filter(ok).length,s:qs.filter(q=>D.items[q.id]&&!ok(q)).length,w:weakL.filter(q=>q.c===c).length}; });
  const top=cats.filter(c=>c.w).sort((a,b)=>b.w-a.w)[0];
  return {hot:hot.length,hotM,pct:Math.round(hotM/hot.length*100),allM:Q.filter(ok).length,seen:Object.keys(D.items).length,weakL,sk,cats,top};
}
function copyText(txt,btn,ta){
  const done=()=>{ btn.textContent="コピーしました"; setTimeout(()=>btn.textContent="コピーする",2000); };
  try{ navigator.clipboard.writeText(txt).then(done,()=>{ ta.focus(); ta.select(); btn.textContent="選んだ文字を長押しでコピー"; }); }
  catch(e){ ta.focus(); ta.select(); btn.textContent="選んだ文字を長押しでコピー"; }
}

function dash(D,ref,canMove){
  const t=statsOf(D,ref), C=2*Math.PI*48;
  const rd=new Date(ref*864e5), late=TODAY-ref;
  let bars="";
  for(let i=13;i>=0;i--){ const n=ref-i, k=ymdN(n), r=D.days[k], dd=new Date(n*864e5), lbl=(dd.getUTCMonth()+1)+"/"+dd.getUTCDate();
    const p=r?Math.round(r.c/r.t*100):0;
    bars+=`<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="font-size:.6rem;color:var(--sub);font-variant-numeric:tabular-nums">${r?p:""}</span>
      <div style="width:100%;max-width:18px;height:80px;background:var(--ai-soft);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden">
        ${r?`<i style="display:block;width:100%;height:${Math.max(p,4)}%;background:${p>=80?"var(--ok)":p>=60?"var(--gold)":"var(--shu)"}"></i>`:""}</div>
      <span style="font-size:.55rem;color:var(--sub);white-space:nowrap">${lbl}</span></div>`; }
  const done14=Array.from({length:14},(_,i)=>D.days[ymdN(ref-i)]).filter(Boolean).length;
  const catHtml=t.cats.map(c=>`<div style="display:flex;flex-direction:column;gap:5px">
      <div style="display:flex;justify-content:space-between;font-size:.88rem;font-weight:700"><span>${c.n}</span><span style="color:var(--sub);font-weight:500;font-variant-numeric:tabular-nums">${c.m}/${c.total}${c.w?`　<span style="color:var(--shu)">苦手${c.w}</span>`:""}</span></div>
      <div class="bar"><i class="m" style="width:${c.m/c.total*100}%"></i><i class="s" style="width:${c.s/c.total*100}%"></i></div></div>`).join("");
  app.querySelector("#pout").innerHTML=`
  <div style="font-size:.85rem;color:var(--sub)">${rd.getUTCMonth()+1}月${rd.getUTCDate()}日時点の記録${late>0?`（${late}日前の報告）`:""}</div>
  <div class="panel"><div class="hero">
    <div class="ring"><svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="48" fill="none" stroke="var(--gold-soft)" stroke-width="12"/>
      <circle cx="55" cy="55" r="48" fill="none" stroke="var(--gold)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-t.pct/100)}"/></svg>
      <div class="num"><span>★よく出る</span><b>${t.pct}%</b><span>${t.hotM}/${t.hot}問</span></div></div>
    <div class="stats">
      <div class="flame">連続 ${t.sk}日</div>
      <div class="stat"><span>2週間でやった日</span><b>${done14} / 14日</b></div>
      <div class="stat"><span>覚えた問題</span><b>${t.allM} / ${Q.length}</b></div>
      <div class="stat"><span>取り組んだ問題</span><b>${t.seen}問</b></div>
      <div class="stat"><span>苦手な問題</span><b style="color:var(--shu)">${t.weakL.length}問</b></div>
    </div></div></div>
  <div class="panel" style="display:flex;flex-direction:column;gap:10px">
    <div class="sec-title" style="margin:0">毎日の正答率（今日の20問）</div>
    <div style="display:flex;gap:3px;align-items:flex-end">${bars}</div>
    <div class="legend"><span><i style="background:var(--ok)"></i>80%以上</span><span><i style="background:var(--gold)"></i>60〜79%</span><span><i style="background:var(--shu)"></i>60%未満</span><span>空らん＝やっていない日</span></div>
  </div>
  <div class="panel" style="display:flex;flex-direction:column;gap:12px">
    <div class="sec-title" style="margin:0">分野べつの習得</div>${catHtml}
    <div class="legend"><span><i style="background:var(--ok)"></i>覚えた</span><span><i style="background:color-mix(in srgb,var(--ok) 35%,var(--ai-soft))"></i>練習中</span></div>
  </div>
  <div class="sec-title">苦手な問題（まちがいが多い順）</div>
  <div class="list">${t.weakL.length?t.weakL.slice(0,15).map(q=>{ const s=D.items[q.id], ans=q.c==="kosei"?q.a+"："+KOSEI[q.a]:q.a;
    return `<div class="item"><div class="w">${CATS[q.c].n}${q.h?" ・★よく出る":""} ・まちがい ${s.wrong}回</div>
      <div class="q">${q.c==="bushu"?"「"+q.q+"」の部首":fmt(esc(q.q))}</div><div class="a">正解：<b>${esc(ans)}</b></div></div>`; }).join(""):'<div class="empty">苦手な問題はありません</div>'}</div>
  ${canMove?`<button class="link" id="mv">この記録をこのスマホに引き継ぐ（機種変更のとき）</button><div id="mvc"></div>`:""}`;
  if(canMove){ app.querySelector("#mv").onclick=()=>{
    app.querySelector("#mvc").innerHTML=`<div class="confirm">このスマホの記録を、報告の記録で上書きします。お子さんが新しいスマホに引き継ぐときだけ使ってください。
      <div class="row"><button id="mn">やめる</button><button class="dang" id="my">引き継ぐ</button></div></div>`;
    app.querySelector("#mn").onclick=()=>app.querySelector("#mvc").innerHTML="";
    app.querySelector("#my").onclick=()=>{ S={items:D.items,days:D.days}; save(); home(); };
  }; }
}

// ===== 起動 =====
const IMPORT_CODE = (new URLSearchParams(location.search).get("import")||"");
async function boot(){
  home();
  let json="";
  try{ json=await apiGetState(); }catch(e){ syncState="ng"; paintSync(); return; }
  let srv=null; try{ if(json) srv=expand(json); }catch(e){}
  if(!srv && /^KK3[zj][A-Za-z0-9_-]+$/.test(IMPORT_CODE)){
    try{ const D=await unpack(IMPORT_CODE); S={items:D.items,days:D.days}; save(); if(!sess) home(); return; }catch(e){}
  }
  if(srv && (srv.updated||0)>(S.updated||0)){ S=srv; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} if(!sess) home(); }
  else if(Object.keys(S.items).length && (!srv || (S.updated||0)>(srv.updated||0))) pushState();
}
boot();
</script>
</body></html>
